<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema de Asistencia</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f7f7f7;
}

.header{
    background:linear-gradient(90deg,#0b4d2b,#1b5e20);
    color:white;
    text-align:center;
    padding:25px;
}

.header h1{
    font-size:32px;
}

.header p{
    margin-top:10px;
    font-size:18px;
}

.contenedor{
    padding:20px;
}

#tituloAlumno{
    text-align:center;
    color:#444;
    font-size:22px;
}

#contador{
    text-align:center;
    color:#0b4d2b;
    font-weight:bold;
    font-size:50px;
    margin:10px 0;
}

.progreso{
    width:90%;
    max-width:700px;
    height:18px;
    margin:20px auto;
    background:#d9e0dc;
    border-radius:20px;
    overflow:hidden;
}

#barra{
    height:100%;
    width:0%;
    background:#0b4d2b;
}

.tarjeta{
    max-width:750px;
    margin:25px auto;
    background:white;
    border-radius:25px;
    padding:30px;
    box-shadow:0 5px 15px rgba(0,0,0,.10);
    text-align:center;
}

#lista{
    color:#b8860b;
    font-size:48px;
    font-weight:bold;
}

.linea{
    height:2px;
    background:#d4af37;
    margin:20px auto;
    width:90%;
}

#nombreAlumno{
    color:#0b4d2b;
    font-size:50px;
    font-weight:bold;
    line-height:1.2;
}

.botones{
    max-width:750px;
    margin:20px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.boton{
    border:none;
    border-radius:20px;
    color:white;
    cursor:pointer;
    padding:35px 20px;
    font-size:28px;
    font-weight:bold;
}

.anterior{
    background:#0b4d2b;
}

.presente{
    background:#43a047;
}

.ausente{
    background:#d32f2f;
}

.siguiente{
    background:#0b4d2b;
}

#descargar{
    display:none;
    margin:20px auto;
    padding:20px 40px;
    font-size:22px;
    border:none;
    border-radius:15px;
    background:#f59e0b;
    color:white;
    cursor:pointer;
}

.footer{
    margin-top:30px;
    background:#0b4d2b;
    color:white;
    text-align:center;
    padding:20px;
}

</style>
</head>

<body>

<div class="header">
    <h1>UAEMéx</h1>
    <p>Sistema de Asistencia</p>
</div>

<div class="contenedor">

    <div id="tituloAlumno">Alumno</div>

    <div id="contador"></div>

    <div class="progreso">
        <div id="barra"></div>
    </div>

    <div class="tarjeta">

        <div id="lista"></div>

        <div class="linea"></div>

        <div id="nombreAlumno"></div>

    </div>

    <div class="botones">

        <button class="boton anterior"
                onclick="anterior()">
            ⬅️<br>Anterior
        </button>

        <button class="boton presente"
                onclick="registrar('Presente')">
            ✅<br>Presente
        </button>

        <button class="boton ausente"
                onclick="registrar('Ausente')">
            ❌<br>Ausente
        </button>

        <button class="boton siguiente"
                onclick="siguiente()">
            ➡️<br>Siguiente
        </button>

    </div>

    <div style="text-align:center">

        <button id="descargar"
                onclick="descargarReporte()">
            📊 Descargar Reporte
        </button>

    </div>

</div>

<div class="footer">
    Sistema de Asistencia Grupo 18
</div>

let asistencias = [];

function mostrarAlumno(){

alumnos[actual].nombre;

document.getElementById("contador").textContent =
(actual + 1) + " de " + alumnos.length;

let porcentaje =
((actual + 1) / alumnos.length) * 100;

document.getElementById("barra").style.width =
porcentaje + "%";

}

function registrar(estado){

asistencias.push({
Lista: alumnos[actual].lista,
Alumno: alumnos[actual].nombre,
Asistencia: estado
});

actual++;
mostrarAlumno();

}else{

"✅ LISTA TERMINADA";

document.getElementById("descargar").style.display =
"inline-block";

}

}

function siguiente(){

if(actual < alumnos.length - 1){
actual++;
mostrarAlumno();
}

}

function anterior(){

if(actual > 0){

mostrarAlumno();
}

}

</body>
</html>
