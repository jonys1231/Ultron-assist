<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultron Assist</title>

https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.jsscript>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:20px;
}

h1{
    color:#2563eb;
}

h2{
    color:#666;
}

.alumno{
    background:white;
    max-width:900px;
    margin:auto;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

#nombreAlumno{
    display:block;
    font-size:32px;
    font-weight:bold;
    margin:25px 0;
}

.botones{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
}

button{
    width:120px;
    height:120px;
    font-size:50px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

.verde{
    background:#22c55e;
}

.rojo{
    background:#ef4444;
}

.flecha{
    background:#3b82f6;
}

#excel{
    display:none;
    width:auto;
    height:auto;
    padding:15px 30px;
    font-size:20px;
    margin-top:20px;
    background:#f59e0b;
    color:white;
}

</style>
</head>

<body>

<h1>Ultron Assist</h1>

<h2 id="contador"></h2>

<div class="alumno">

<span id="nombreAlumno"></span>

<div class="botones">

<button class="flecha" onclick="anterior()">⬅️</button>

<button class="verde" onclick="registrar('Presente')">🟢</button>

<button class="rojo" onclick="registrar('Ausente')">🔴</button>

<button class="flecha" onclick="siguiente()">➡️</button>

</div>

<button id="excel" onclick="descargarExcel()">
📊 Descargar Excel
</button>

</div>

<script>

const alumnos = [
{lista:1,nombre:"AGUILAR ROCHA FABIAN YAIR"},

{lista:15,nombre:"JARDON ALBA DARSHAN BAKARI"},
{lista:16,nombre:"JIMENEZ CORTEZ DIEGO JADIEL"},

{lista:18,nombre:"LOME CHEPE JOSE MIGUEL"},
{lista:19,nombre:"LOPEZ BERNAL AZUL CAMILA"},
{lista:20,nombre:"MANCILLA SALINAS ESTRELLA GUADALUPE"},
{lista:21,nombre:"MARTINEZ CHAVEZ ARIANA ABIGAIL"},

{lista:38,nombre:"VASQUEZ CASTAÑEDA KENIA CAMILA"},
{lista:39,nombre:"VASQUEZ TAPIA SEBASTIAN"}
];

let actual = 0;
let asistencias = [];

function mostrarAlumno(){

document.getElementById("nombreAlumno").textContent =
"Lista " +
alumnos[actual].lista +
" | " +
alumnos[actual].nombre;

document.getElementById("contador").textContent =
"Alumno " +
(actual + 1) +
" de " +
alumnos.length;

}

function registrar(estado){

asistencias.push({
Lista: alumnos[actual].lista,
Alumno: alumnos[actual].nombre,
Asistencia: estado
});

if(actual < alumnos.length - 1){

actual++;
mostrarAlumno();

}else{

document.getElementById("nombreAlumno").textContent =
"✅ Lista terminada";

document.getElementById("contador").textContent =
"Asistencias registradas: " +
asistencias.length;

document.getElementById("excel").style.display =
"inline-block";

}

}

function siguiente(){

if(actual < alumnos.length - 1){
actual++;
mostrarAlumno();
}

}

function anterior(){

if(actual > 0){
actual--;
mostrarAlumno();
}

}

function descargarExcel(){

const hoja = XLSX.utils.json_to_sheet(asistencias);

const libro = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
libro,
hoja,
"Asistencia"
);

XLSX.writeFile(
libro,
"Asistencia_Grupo18.xlsx"
);

}

mostrarAlumno();

</script>

</body>
</html>
