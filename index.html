<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultron Assist</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:30px;
}

h1{
    color:#2563eb;
}

.alumno{
    background:white;
    padding:30px;
    border-radius:20px;
    max-width:700px;
    margin:auto;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

#nombreAlumno{
    display:block;
    font-size:32px;
    font-weight:bold;
    margin-bottom:30px;
}

button{
    width:140px;
    height:140px;
    font-size:60px;
    border:none;
    border-radius:20px;
    margin:10px;
    cursor:pointer;
}

.verde{
    background:#22c55e;
}

.rojo{
    background:#ef4444;
}

</style>
</head>
<body>

<h1>Ultron Assist</<h2>
    id="contador">Alumno 1 de 39</h2>
<div class="alumno">
    <span id="nombreAlumno"></span>

    <div>
        <button class="verde" onclick="siguiente()">🟢</button>
        <button class="rojo" onclick="siguiente()">🔴</button>
    </div>
</div>
