<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Sistema de Asistencia</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#f4f4f4;
}

.header{
background:linear-gradient(90deg,#0b4f2f,#116d42);
color:white;
text-align:center;
padding:25px;
}

.header h1{
font-size:32px;
}

.header p{
font-size:18px;
margin-top:5px;
}

.contenedor{
padding:20px;
}

#titulo{
text-align:center;
font-size:22px;
color:#555;
}

#contador{
text-align:center;
font-size:50px;
font-weight:bold;
color:#0b4f2f;
margin:10px 0;
}

.progreso{
width:90%;
max-width:700px;
height:16px;
background:#ddd;
margin:20px auto;
border-radius:20px;
overflow:hidden;
}

#barra{
height:100%;
width:0%;
background:#0b4f2f;
}

.tarjeta{
background:white;
max-width:750px;
margin:auto;
border-radius:25px;
padding:30px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
text-align:center;
}

#lista{
font-size:42px;
font-weight:bold;
color:#b8860b;
}

.linea{
height:2px;
background:#d4af37;
margin:20px auto;
width:90%;
}

#nombreAlumno{
font-size:46px;
font-weight:bold;
line-height:1.2;
color:#0b4f2f;
}

.botones{
max-width:750px;
margin:20px auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.boton{
border:none;
border-radius:20px;
padding:35px;
font-size:28px;
font-weight:bold;
color:white;
cursor:pointer;
}

.presente{
background:#43a047;
}

.ausente{
background:#d32f2f;
}

.anterior{
background:#0b4f2f;
}

.siguiente{
background:#0b4f2f;
}

#descargar{
display:none;
margin-top:20px;
padding:18px 30px;
font-size:22px;
background:#f59e0b;
color:white;
border:none;
border-radius:15px;
cursor:pointer;
}

.footer{
margin-top:30px;
background:#0b4f2f;
color:white;
text-align:center;
padding:20px;
}

</style>
</head>

<body>

</div>

<div id="titulo">Alumno</div>

<div id="contador"></div>

<div class="progreso">
<div id="barra"></div>
</div>

<div class="tarjeta">
<div id="lista"></div>
<div class="linea"></div>
<div id="nombreAlumno"></div>

</button>

⬅️<br>Anterior
</button>

<button class="boton siguiente"
onclick="siguiente()">
➡️<br>Siguiente
</button>

</div>

<div style="text-align:center;">
<button id="descargar"
onclick="descargarReporte()">
📊 Descargar Reporte
</button>
</div>

</div>

<div class="footer">

</div>

function registrar(estado){

Alumno: alumnos[actual].nombre,
Asistencia: estado
};

"inline-block";
}
}

}
